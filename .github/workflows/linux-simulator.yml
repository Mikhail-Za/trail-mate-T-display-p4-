name: Linux Simulator

on:
  push:
    paths:
      - "apps/linux_sim_shell/**"
      - "apps/esp32_lvgl/src/esp32_lvgl_field_guide_app.cpp"
      - "scripts/check_field_guide_photo_safety.py"
      - "scripts/check_field_guide_photo_staging.py"
      - "scripts/check_packet_id_storage.py"
      - "scripts/check_radio_packet_ids.py"
      - "scripts/check_channel_config_load.py"
      - "platform/esp/radio/**"
      - "platform/esp/idf_common/src/idf_chat_factory.cpp"
      - "platform/esp/idf_common/src/idf_chat_facade.cpp"
      - "platform/esp/idf_common/include/platform/esp/idf_common/idf_chat_factory.h"
      - "tools/offline_content/build_sd_content.py"
      - "builds/linux_cmake/**"
      - "cmake/**"
      - "modules/core_chat/**"
      - "modules/core_gps/**"
      - "modules/core_sys/**"
      - "modules/product_composition/**"
      - "modules/ui_ascii_runtime/**"
      - "modules/ui_key_verification_runtime/**"
      - "modules/ui_legacy_adapters/**"
      - "modules/ui_lvgl_ux_packs/**"
      - "modules/ui_map_runtime/**"
      - "modules/ui_presentation/**"
      - "platform/linux/**"
      - ".github/workflows/linux-simulator.yml"
  pull_request:
    paths:
      - "apps/linux_sim_shell/**"
      - "apps/esp32_lvgl/src/esp32_lvgl_field_guide_app.cpp"
      - "scripts/check_field_guide_photo_safety.py"
      - "scripts/check_field_guide_photo_staging.py"
      - "scripts/check_packet_id_storage.py"
      - "scripts/check_radio_packet_ids.py"
      - "scripts/check_channel_config_load.py"
      - "platform/esp/radio/**"
      - "platform/esp/idf_common/src/idf_chat_factory.cpp"
      - "platform/esp/idf_common/src/idf_chat_facade.cpp"
      - "platform/esp/idf_common/include/platform/esp/idf_common/idf_chat_factory.h"
      - "tools/offline_content/build_sd_content.py"
      - "builds/linux_cmake/**"
      - "cmake/**"
      - "modules/core_chat/**"
      - "modules/core_gps/**"
      - "modules/core_sys/**"
      - "modules/product_composition/**"
      - "modules/ui_ascii_runtime/**"
      - "modules/ui_key_verification_runtime/**"
      - "modules/ui_legacy_adapters/**"
      - "modules/ui_lvgl_ux_packs/**"
      - "modules/ui_map_runtime/**"
      - "modules/ui_presentation/**"
      - "platform/linux/**"
      - ".github/workflows/linux-simulator.yml"

permissions:
  contents: read

jobs:
  simulator:
    name: Linux simulator shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify shared/platform UI boundaries
        run: python3 scripts/check_platform_ui_boundaries.py

      - name: Verify field guide photo safety
        run: |
          python3 scripts/check_field_guide_photo_safety.py
          python3 scripts/check_field_guide_photo_staging.py

      - name: Verify native radio packet IDs and channel loading
        run: |
          python3 scripts/check_packet_id_storage.py
          python3 scripts/check_radio_packet_ids.py
          python3 scripts/check_channel_config_load.py

      - name: Install simulator build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure simulator
        working-directory: builds/linux_cmake
        run: cmake --preset linux-simulator-debug

      - name: Build simulator
        working-directory: builds/linux_cmake
        run: cmake --build --preset linux-simulator-debug-build

      - name: Run simulator smoke tests
        working-directory: builds/linux_cmake
        run: ctest --preset linux-simulator-debug-test
